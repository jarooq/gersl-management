name: gersl_mobile
description: "GERSL field staff mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + DI
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Permissions + device
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2

  # Background GPS tracking (foreground notification on Android)
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.3

  # Open PDFs / external URLs (payslip download → external viewer)
  url_launcher: ^6.3.1

  # Map for the programmes "my items nearby" screen. OpenStreetMap tiles, no
  # API key. latlong2 is the standard companion package for coordinates.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Firebase Cloud Messaging — push notifications for approvals, programme
  # assignments, deadline reminders. Dormant until google-services.json +
  # GoogleService-Info.plist are dropped in.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Date/Number formatting
  intl: ^0.20.0

  # Typography (Inter to match the admin web)
  google_fonts: ^6.2.1

  # Charting (Attendance donut)
  fl_chart: ^0.69.0

  # On-device face detection for Punch — blocks attempts where the captured
  # selfie has no human face (paper photo, wall shot, etc.). Recognition
  # (matching a specific staff member) is NOT implemented — this is presence
  # only. Adds ~10-15 MB to the APK via Google ML Kit native lib.
  google_mlkit_face_detection: ^0.13.1

  # Crash + error reporting (init lazily — no DSN = no-op).
  # Pinned to 9.x because Kotlin 2.2 compiler no longer accepts 8.x's
  # languageVersion 1.6.
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ============================================
# Launcher icon — placeholder; swap assets/icon/icon.png for real branding
# Generate with:  dart run flutter_launcher_icons
# ============================================
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # Background blue matches the ehsan.png edge so the Android adaptive mask
  # blends with the icon's built-in rounded square instead of showing navy.
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

# ============================================
# Splash screen
# Generate with:  dart run flutter_native_splash:create
# ============================================
flutter_native_splash:
  color: "#10212F"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#10212F"
    image: assets/icon/icon_foreground.png
