
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2C3E"/>
      <stop offset="100%" stop-color="#0A1722"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#A4F056" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#A4F056" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A4F056" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topShine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- squircle (iOS-style) — 22% radius for soft modern feel -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>
  <!-- top shine for depth -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#topShine)"/>
  <!-- soft mission glow behind the mark -->
  <circle cx="512" cy="512" r="430" fill="url(#glow)"/>
  
    <!-- Subtle ring -->
    <circle cx="512" cy="512" r="380" fill="none"
      stroke="#A4F056" stroke-opacity="0.18" stroke-width="14"/>

    <!-- Cupped hand (stylised) -->
    <path
      d="
        M 320 590
        C 320 470, 410 410, 512 410
        C 614 410, 704 470, 704 590
        L 704 640
        C 704 700, 660 740, 600 740
        L 424 740
        C 364 740, 320 700, 320 640
        Z
      "
      fill="#A4F056"
      stroke="none"
      stroke-width="6"
    />

    <!-- Wrist accent strip -->
    <rect x="372" y="710" width="280" height="22" rx="11" fill="#C8FA8E" opacity="0.65"/>

    <!-- Spark / benevolence flame above the palm -->
    <path
      d="
        M 512 250
        C 470 320, 470 360, 512 410
        C 554 360, 554 320, 512 250
        Z
      "
      fill="#C8FA8E"
    />
    <circle cx="512" cy="370" r="22" fill="#FFFFFF" opacity="0.95"/>
  
</svg>