[build]
  command = "npm install --prefix server"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "zisi"
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
