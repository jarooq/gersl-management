name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Don't fail CI on existing lint debt; surface it but keep CI green.
        # Flip to plain `npm run lint` once the working tree is clean.
        run: npm run lint || true

      - name: Build
        run: npm run build

  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Syntax check (node --check)
        working-directory: server
        run: |
          set -e
          find src -type f -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Module-load smoke test
        working-directory: server
        env:
          DB_USE_SQLITE: 'true'
          JWT_SECRET: ci-only-not-secret
        run: |
          node -e "import('./src/models/index.js').then(() => { console.log('models load OK'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); })"
