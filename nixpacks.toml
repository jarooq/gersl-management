# Tells Nixpacks (Railway's default builder) to use a recent Node.
# Railway autodetects this for both root and server/ package.json.
[providers]
node = "20"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install --no-fund --no-audit",
  "cd server && npm install --no-fund --no-audit --omit=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "node server/src/server.js"
