# =============================================================================
# Codemagic CI for the GERSL mobile app (Flutter, lives in /mobile)
#
# Two workflows you can launch from the Codemagic dashboard:
#   • android-workflow  → release APK + AAB
#   • ios-workflow      → signed IPA (needs Apple Developer + signing set up)
#
# Quick-start (one-time):
#   1. Sign up at codemagic.io, "Add application" → connect this GitHub repo.
#   2. In the project, Settings → Environment variables, add:
#        SENTRY_DSN     (optional — leave blank to disable crash reporting)
#        API_BASE_URL   (optional — defaults to the prod Vercel URL)
#   3. Android signing: Settings → Code signing → Android → upload your
#      keystore.jks and add aliases. Reference name = "gersl_keystore".
#      (Skip if you only want unsigned APKs for internal testing — see
#      the comment in build_apk_unsigned step below.)
#   4. iOS signing: Settings → Code signing → iOS → connect Apple Developer
#      account, let Codemagic auto-create cert + provisioning profile. Set
#      bundle id to com.gersl.gerhr (or whatever you used in
#      mobile/ios/Runner.xcodeproj).
#   5. Push this file; Codemagic auto-detects it. Trigger workflows from
#      the dashboard.
#
# Free tier gives 500 build minutes/month — plenty for a small team.
# =============================================================================

workflows:

  # ---------------------------------------------------------------------------
  # ANDROID — release APK + AAB
  # ---------------------------------------------------------------------------
  android-workflow:
    name: GERSL Android (release)
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17
      vars:
        # Build-time --dart-define values. Leave blank if not configured.
        SENTRY_DSN: $SENTRY_DSN
        # Hardcoded — production URL is stable and shouldn't be a Codemagic
        # secret. If you ever need to override, add API_BASE_URL to the
        # gerhr group and that will take precedence.
        API_BASE_URL: https://gersl-management-jet.vercel.app/api
        ENV: production
      # Uncomment when you've uploaded a keystore in Codemagic UI:
      # android_signing:
      #   - gersl_keystore

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    triggering:
      events: []  # manual only; flip to [push] if you want auto-builds on main

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version
          flutter doctor

      - name: Get pub packages
        working_directory: mobile
        script: flutter pub get

      - name: Static analysis
        working_directory: mobile
        ignore_failure: true
        script: flutter analyze

      - name: Build release APK
        working_directory: mobile
        script: |
          flutter build apk --release \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENV="$ENV"

      - name: Build release AAB (Play Store bundle)
        working_directory: mobile
        script: |
          flutter build appbundle --release \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENV="$ENV"

    artifacts:
      - mobile/build/**/outputs/**/*.apk
      - mobile/build/**/outputs/**/*.aab
      - mobile/build/**/outputs/**/mapping.txt

    # No `publishing:` block on purpose. Codemagic emails the build owner
    # by default; artifacts are downloadable from the build page. To wire
    # Play Store internal-track auto-publish, add a `publishing:` block
    # with `google_play:` after connecting a Google Play service account
    # in Codemagic UI — see Codemagic docs.

  # ---------------------------------------------------------------------------
  # iOS — signed IPA (requires Apple Developer + Codemagic signing)
  # ---------------------------------------------------------------------------
  ios-workflow:
    name: GERSL iOS (release)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # No `integrations:` block — using App Store Connect API key directly
    # via env vars below. Set these in Codemagic UI → Project → Environment
    # variables (all three marked Secure):
    #   APP_STORE_CONNECT_KEY_IDENTIFIER  (10-char Key ID, e.g. S32WP7H448)
    #   APP_STORE_CONNECT_ISSUER_ID       (UUID from App Store Connect)
    #   APP_STORE_CONNECT_PRIVATE_KEY     (full .p8 file contents)
    # The app-store-connect CLI auto-detects them from this exact triple.

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Pull the App Store Connect API key from the `gerhr` variable group
      # in Codemagic UI — that's where these three live:
      #   APP_STORE_CONNECT_KEY_IDENTIFIER
      #   APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_PRIVATE_KEY
      groups:
        - gerhr
      vars:
        SENTRY_DSN: $SENTRY_DSN
        # Hardcoded — production URL is stable and shouldn't be a Codemagic
        # secret. If you ever need to override, add API_BASE_URL to the
        # gerhr group and that will take precedence.
        API_BASE_URL: https://gersl-management-jet.vercel.app/api
        ENV: production
        BUNDLE_ID: "com.gersl.gerhr"
      # NOTE: no `ios_signing:` block on purpose. That block makes Codemagic
      # look up profiles in its UI-managed signing-identities store, which
      # we're not using. We fetch the profile via App Store Connect API in
      # the scripts below instead.

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events: []   # manual

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version
          flutter doctor

      - name: Get pub packages
        working_directory: mobile
        script: flutter pub get

      - name: Pod install
        working_directory: mobile/ios
        script: |
          find . -name "Podfile" -execdir pod install --repo-update \;

      - name: Initialise keychain
        script: keychain initialize

      - name: Generate fresh RSA key for the iOS distribution certificate
        # Two different "private keys" are needed in this flow:
        #   1. The App Store Connect API key (.p8) — auth with Apple's API
        #   2. The iOS Distribution Certificate private key — signs the IPA
        # This step creates #2. fetch-signing-files binds it to a fresh cert.
        # If Apple's "max distribution certs" limit is hit, this returns a
        # 409 — revoke an unused cert in Apple Developer Portal and retry.
        script: |
          mkdir -p /tmp/cm-cert
          openssl genrsa -out /tmp/cm-cert/private_key.pem 2048

      - name: Verify App Store Connect API auth
        # Self-diagnose: print partial values so we can see which Key ID
        # and which Issuer ID the build actually received from Codemagic.
        # Key ID and Issuer ID are NOT secrets (they're public identifiers).
        script: |
          echo "KEY_IDENTIFIER : '$APP_STORE_CONNECT_KEY_IDENTIFIER' (length=${#APP_STORE_CONNECT_KEY_IDENTIFIER})"
          echo "ISSUER_ID      : '$APP_STORE_CONNECT_ISSUER_ID' (length=${#APP_STORE_CONNECT_ISSUER_ID})"
          echo "PRIVATE_KEY    length=${#APP_STORE_CONNECT_PRIVATE_KEY} (value redacted)"
          echo "Bundle id      : $BUNDLE_ID"
          echo ""
          echo "Expected Key ID format: 10 chars uppercase (e.g. 389L4N899L)"
          echo "Expected Issuer ID    : UUID with hyphens (8-4-4-4-12)"
          echo "Expected PK length    : ~270 chars (raw PEM) or ~360 chars (base64-encoded PEM)"
          echo ""
          echo "--- attempt a no-create read to confirm auth works at all ---"
          app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" --json 2>&1 | head -20 || echo "(list failed)"

      - name: Fetch (or create) signing files
        script: |
          # Hard-fail early with a clear message if any required env var is
          # missing in the build environment.
          MISSING=""
          [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && MISSING="$MISSING APP_STORE_CONNECT_KEY_IDENTIFIER"
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]      && MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]    && MISSING="$MISSING APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then
            echo "==============================================="
            echo "❌ Missing Codemagic environment variable(s):"
            for v in $MISSING; do echo "   - $v"; done
            echo "==============================================="
            exit 99
          fi

          # Codemagic's env-var input often mangles multi-line PEM (collapses
          # newlines), so the CLI complains "not a valid PEM encoded private
          # key". Accept BOTH raw PEM and base64-encoded forms — write the
          # decoded key to a real file and pass it via --private-key=@file:.
          KEY_FILE=/tmp/app_store_connect_key.p8
          if printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | head -c 200 | grep -q "BEGIN PRIVATE KEY"; then
            # Already in PEM format — write as-is.
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_FILE"
            echo "Detected raw PEM private key in env var."
          else
            # Assume base64 — decode to file. tr strips any newlines/spaces.
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d ' \n\r\t' | base64 -d > "$KEY_FILE"
            echo "Decoded base64-encoded private key to $KEY_FILE"
          fi

          # Quick sanity check — file should start with PEM header now.
          if ! head -1 "$KEY_FILE" | grep -q "BEGIN"; then
            echo "❌ APP_STORE_CONNECT_PRIVATE_KEY is neither valid PEM nor"
            echo "   valid base64 of a PEM file. Re-check the value in"
            echo "   Codemagic env vars (gerhr group)."
            exit 98
          fi

          # Pass everything explicitly:
          #   --private-key      → App Store Connect API key (the .p8)
          #   --certificate-key  → iOS Distribution Certificate's RSA key
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key=@file:"$KEY_FILE" \
            --certificate-key=@file:/tmp/cm-cert/private_key.pem \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Increment build number
        working_directory: mobile
        script: |
          # Each TestFlight upload needs a unique build number. Use the
          # Codemagic build number as a guaranteed-monotonic source.
          # ($PROJECT_BUILD_NUMBER is auto-injected by Codemagic.)
          BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="$BUILD_NUMBER"; fi
          sed -i.bak "s/^version: \(.*\)+.*$/version: \1+$BUILD_NUMBER/" pubspec.yaml || true
          rm -f pubspec.yaml.bak
          grep "^version:" pubspec.yaml

      - name: Build release IPA
        working_directory: mobile
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENV="$ENV"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - mobile/flutter_drive.log

    publishing:
      # email block omitted — Codemagic emails build owner by default.
      app_store_connect:
        # Use the same API-key env vars from the project Environment Variables
        # (set as Secure). No Codemagic-side "integration" needed.
        api_key:    $APP_STORE_CONNECT_PRIVATE_KEY
        key_id:     $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id:  $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Add your internal tester group name once it exists in App Store
        # Connect → TestFlight → Internal Testing. Until then, the build
        # uploads but you'll need to add testers manually.
        # beta_groups:
        #   - GERSL Internal
