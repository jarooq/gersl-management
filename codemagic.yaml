# =============================================================================
# Codemagic CI for the GERSL mobile app (Flutter, lives in /mobile)
#
# Two workflows you can launch from the Codemagic dashboard:
#   • android-workflow  → release APK + AAB
#   • ios-workflow      → signed IPA (needs Apple Developer + signing set up)
#
# Quick-start (one-time):
#   1. Sign up at codemagic.io, "Add application" → connect this GitHub repo.
#   2. In the project, Settings → Environment variables, add:
#        SENTRY_DSN     (optional — leave blank to disable crash reporting)
#        API_BASE_URL   (optional — defaults to the prod Vercel URL)
#   3. Android signing: Settings → Code signing → Android → upload your
#      keystore.jks and add aliases. Reference name = "gersl_keystore".
#      (Skip if you only want unsigned APKs for internal testing — see
#      the comment in build_apk_unsigned step below.)
#   4. iOS signing: Settings → Code signing → iOS → connect Apple Developer
#      account, let Codemagic auto-create cert + provisioning profile. Set
#      bundle id to com.gersl.gerhr (or whatever you used in
#      mobile/ios/Runner.xcodeproj).
#   5. Push this file; Codemagic auto-detects it. Trigger workflows from
#      the dashboard.
#
# Free tier gives 500 build minutes/month — plenty for a small team.
# =============================================================================

workflows:

  # ---------------------------------------------------------------------------
  # ANDROID — release APK + AAB
  # ---------------------------------------------------------------------------
  android-workflow:
    name: GERSL Android (release)
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17
      vars:
        # Build-time --dart-define values. Leave blank if not configured.
        SENTRY_DSN: $SENTRY_DSN
        API_BASE_URL: $API_BASE_URL
        ENV: production
      # Uncomment when you've uploaded a keystore in Codemagic UI:
      # android_signing:
      #   - gersl_keystore

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches

    triggering:
      events: []  # manual only; flip to [push] if you want auto-builds on main

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version
          flutter doctor

      - name: Get pub packages
        working_directory: mobile
        script: flutter pub get

      - name: Static analysis
        working_directory: mobile
        ignore_failure: true
        script: flutter analyze

      - name: Build release APK
        working_directory: mobile
        script: |
          flutter build apk --release \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENV="$ENV"

      - name: Build release AAB (Play Store bundle)
        working_directory: mobile
        script: |
          flutter build appbundle --release \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENV="$ENV"

    artifacts:
      - mobile/build/**/outputs/**/*.apk
      - mobile/build/**/outputs/**/*.aab
      - mobile/build/**/outputs/**/mapping.txt

    # No `publishing:` block on purpose. Codemagic emails the build owner
    # by default; artifacts are downloadable from the build page. To wire
    # Play Store internal-track auto-publish, add a `publishing:` block
    # with `google_play:` after connecting a Google Play service account
    # in Codemagic UI — see Codemagic docs.

  # ---------------------------------------------------------------------------
  # iOS — signed IPA (requires Apple Developer + Codemagic signing)
  # ---------------------------------------------------------------------------
  ios-workflow:
    name: GERSL iOS (release)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # No `integrations:` block — using App Store Connect API key directly
    # via env vars below. Set these in Codemagic UI → Project → Environment
    # variables (all three marked Secure):
    #   APP_STORE_CONNECT_KEY_IDENTIFIER  (10-char Key ID, e.g. S32WP7H448)
    #   APP_STORE_CONNECT_ISSUER_ID       (UUID from App Store Connect)
    #   APP_STORE_CONNECT_PRIVATE_KEY     (full .p8 file contents)
    # The app-store-connect CLI auto-detects them from this exact triple.

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        SENTRY_DSN: $SENTRY_DSN
        API_BASE_URL: $API_BASE_URL
        ENV: production
        BUNDLE_ID: "com.gersl.gerhr"  # matches Runner.xcodeproj PRODUCT_BUNDLE_IDENTIFIER
        # APP_STORE_APP_ID: "1234567890"    # set in Codemagic env vars after first TestFlight upload
      ios_signing:
        distribution_type: app_store          # or ad_hoc / development
        bundle_identifier: com.gersl.gerhr

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events: []   # manual

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version
          flutter doctor

      - name: Get pub packages
        working_directory: mobile
        script: flutter pub get

      - name: Pod install
        working_directory: mobile/ios
        script: |
          find . -name "Podfile" -execdir pod install --repo-update \;

      - name: Initialise keychain
        script: keychain initialize

      - name: Fetch (or create) signing files
        # Forces profile creation via App Store Connect API if no matching
        # profile exists yet. The plain `ios_signing` block + `use-profiles`
        # only LOOKS UP profiles; this step actually CREATES one when the
        # bundle id has none.
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Increment build number
        working_directory: mobile
        script: |
          # Each TestFlight upload needs a unique build number. Use the
          # Codemagic build number as a guaranteed-monotonic source.
          # ($PROJECT_BUILD_NUMBER is auto-injected by Codemagic.)
          BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="$BUILD_NUMBER"; fi
          sed -i.bak "s/^version: \(.*\)+.*$/version: \1+$BUILD_NUMBER/" pubspec.yaml || true
          rm -f pubspec.yaml.bak
          grep "^version:" pubspec.yaml

      - name: Build release IPA
        working_directory: mobile
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENV="$ENV"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - mobile/flutter_drive.log

    publishing:
      # email block omitted — Codemagic emails build owner by default.
      app_store_connect:
        # Use the same API-key env vars defined at the top of this workflow
        # (no Codemagic "integration" needed).
        auth: keys
        submit_to_testflight: true
        # Add your internal tester group name once it exists in App Store
        # Connect → TestFlight → Internal Testing. Until then, the build
        # uploads but you'll need to add testers manually.
        # beta_groups:
        #   - GERSL Internal
